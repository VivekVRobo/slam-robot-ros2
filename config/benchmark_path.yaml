profile: loop_square
simulation_only: true
# Collision-free 1 m square in the south-west corner of slam_lab.
# Start pose is (-2.8, -2.8).  The previous 2.24 m legs crossed the
# inner_b wall at x=-1.3 on the return leg, so the commanded "loop" could
# not physically close and the benchmark correctly failed its revisit gate.
# Four 1.0 m legs keep the robot clear of inner_b while preserving a 4 m
# ground-truth loop, above the loop detector's 3 m minimum-path requirement.
segments:
  - {name: settle, duration_s: 2.0, linear_x: 0.0, angular_z: 0.0}
  - {name: leg_1, duration_s: 4.0, linear_x: 0.25, angular_z: 0.0}
  - {name: turn_1, duration_s: 2.10, linear_x: 0.0, angular_z: 0.75}
  - {name: leg_2, duration_s: 4.0, linear_x: 0.25, angular_z: 0.0}
  - {name: turn_2, duration_s: 2.10, linear_x: 0.0, angular_z: 0.75}
  - {name: leg_3, duration_s: 4.0, linear_x: 0.25, angular_z: 0.0}
  - {name: turn_3, duration_s: 2.10, linear_x: 0.0, angular_z: 0.75}
  - {name: leg_4, duration_s: 4.0, linear_x: 0.25, angular_z: 0.0}
  - {name: turn_4, duration_s: 2.10, linear_x: 0.0, angular_z: 0.75}
  - {name: settle_end, duration_s: 3.0, linear_x: 0.0, angular_z: 0.0}
