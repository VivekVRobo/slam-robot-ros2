name: Engineering CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q setup.py launch slam_robot_ros2 tools
      - name: Parse XML and YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET, yaml
          for p in ['package.xml','urdf/robot.urdf.xacro','simulation/worlds/slam_lab.sdf','simulation/models/slam_robot/model.sdf','simulation/models/slam_robot/model.config']:
              ET.parse(p); print('parsed',p)
          for p in Path('config').glob('*.yaml'):
              yaml.safe_load(p.read_text()); print('parsed',p)
          for p in Path('benchmarks').glob('*.yaml'):
              yaml.safe_load(p.read_text()); print('parsed',p)
          PY
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - run: pytest -q
      - run: python tools/config_lint.py
      - run: python tools/urdf_lint.py
      - run: python tools/simulation_lint.py
      - name: Hardware evidence template contract
        run: |
          python tools/hardware_profile_lint.py
          python tools/evidence_manifest.py evidence/manifest.example.yaml
      - name: Prove measured hardware remains blocked
        shell: bash
        run: |
          if python tools/hardware_profile_lint.py --require-measured; then
            echo 'ERROR: unmeasured hardware template passed measured validation'
            exit 1
          fi
          if python tools/release_gate.py hardware-data-ready; then
            echo 'ERROR: hardware-data-ready passed without physical evidence'
            exit 1
          fi
          echo 'Expected: physical hardware gates remain blocked.'
      - run: python tools/map_metrics.py examples/sample_map.pgm --output artifacts/map-metrics.json
      - run: python tools/odom_metrics.py examples/sample_odom.csv --output artifacts/odom-metrics.json
      - run: python tools/generate_report.py --output artifacts/engineering-report.md
      - run: python tools/release_gate.py reference
      - name: Prove hardware mapping gate remains blocked
        shell: bash
        run: |
          if python tools/release_gate.py hardware-mapping-validated; then exit 1; fi
          echo 'Expected: hardware mapping remains evidence-gated.'
      - uses: actions/upload-artifact@v4
        with: {name: slam-engineering-artifacts, path: artifacts/, if-no-files-found: error}

  ros-lyrical-build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:resolute
    steps:
      - uses: actions/checkout@v4
      - name: Setup ROS 2 Lyrical
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: lyrical
      - name: Resolve ROS dependencies
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          rosdep update
          rosdep install --from-paths . --ignore-src --rosdistro lyrical -r -y
      - name: Build ROS package
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --packages-select slam_robot_ros2 --symlink-install --event-handlers console_direct+
      - name: Test ROS package
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          source install/setup.bash
          colcon test --packages-select slam_robot_ros2 --event-handlers console_direct+ --pytest-args test
          colcon test-result --verbose
