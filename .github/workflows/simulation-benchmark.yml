name: Gazebo Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/simulation-benchmark.yml'
      - 'package.xml'
      - 'setup.py'
      - 'launch/**'
      - 'simulation/**'
      - 'config/**'
      - 'slam_robot_ros2/**'
      - 'scripts/run_gazebo_benchmark.sh'
      - 'scripts/evaluate_benchmark.sh'
      - 'tools/**'
      - 'benchmarks/**'
  push:
    branches:
      - 'growth/tier-a-slam-evidence'
    paths:
      - '.github/workflows/simulation-benchmark.yml'
      - 'package.xml'
      - 'setup.py'
      - 'launch/**'
      - 'simulation/**'
      - 'config/**'
      - 'slam_robot_ros2/**'
      - 'scripts/run_gazebo_benchmark.sh'
      - 'scripts/evaluate_benchmark.sh'
      - 'tools/**'
      - 'benchmarks/**'

permissions: {contents: read}

jobs:
  headless-gazebo-benchmark:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:resolute
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Setup ROS 2 Lyrical
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: lyrical
      - name: Resolve runtime dependencies
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y --rosdistro lyrical
      - name: Install benchmark Python dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-yaml
      - name: Build package
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --packages-select slam_robot_ros2 --symlink-install --event-handlers console_direct+
      - name: Static simulation contract
        run: python3 tools/simulation_lint.py
      - name: Capture benchmark environment
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          source install/setup.bash
          mkdir -p artifacts
          {
            echo "commit=${GITHUB_SHA:-unknown}"
            echo "ros_distro=${ROS_DISTRO:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo '--- uname ---'
            uname -a
            echo '--- os-release ---'
            cat /etc/os-release
            echo '--- python ---'
            python3 --version
            echo '--- gazebo ---'
            gz sim --version 2>&1 || true
            echo '--- package prefixes ---'
            ros2 pkg prefix slam_robot_ros2 2>&1 || true
            ros2 pkg prefix slam_toolbox 2>&1 || true
            ros2 pkg prefix ros_gz_sim 2>&1 || true
            ros2 pkg prefix nav2_map_server 2>&1 || true
          } > artifacts/environment.txt
      - name: Run headless physics SLAM benchmark
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          source install/setup.bash
          bash scripts/run_gazebo_benchmark.sh
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gazebo-slam-benchmark-evidence
          path: artifacts/
          if-no-files-found: error
      - name: Evidence scope
        if: always()
        run: |
          echo 'This workflow produces simulation evidence only.'
          echo 'A green run may support Gazebo/simulation maturity gates, never hardware validation gates.'
